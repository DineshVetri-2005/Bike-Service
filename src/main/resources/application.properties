# Application
spring.application.name=RevTune
server.port=${PORT:8081}

# SQLite Datasource
spring.datasource.url=jdbc:sqlite:revtune.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate / JPA - SQLite dialect (from hibernate-community-dialects)
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable open-in-view warning noise
spring.jpa.open-in-view=false

# Jackson - don't fail on empty beans
spring.jackson.serialization.fail-on-empty-beans=false

# Serialize LocalDate/LocalTime as ISO-8601 strings instead of arrays
spring.jackson.serialization.write-dates-as-timestamps=false
